function trustWidget(){const v=s.boardConfidence;return '<div class="card"><h2>Board Confidence</h2><div class="trust-layout"><div class="trust-ring '+(v>=65?'good':v>=35?'mid':'bad')+'" style="--score:'+v+'"><strong>'+v+'%</strong><small>TRUST</small></div><div class="trust-copy"><h3>'+(v>=75?'Board delighted':v>=55?'Job secure':v>=35?'Under pressure':'Job in danger')+'</h3><p>Finish in the top '+s.boardTarget+' to satisfy the board. Seven straight defeats or trust of 15% means dismissal.</p></div></div></div>'}
function tierWidget(){const names=['Premier Division','Championship','League One'];return '<div class="card"><h2>League Pyramid</h2><div class="league-tiers">'+names.map((name,i)=>'<div class="tier '+(s.division===i+1?'current':'')+'"><span>'+(i===0?'👑':i===1?'🛡️':'⚔️')+'</span><strong>'+name+'</strong><small>'+(s.division===i+1?'YOUR LEAGUE':'Tier '+(i+1))+'</small></div>').join('')+'</div><p class="muted">Top two move up and bottom two move down where another tier exists. Premier Division is the highest tier.</p></div>'}
function trophyRoom(){const champions=s.career.trophies;const boots=s.seasonAwards.filter(x=>x.award==='Golden Boot'&&x.club===s.clubs[s.club].name).length;const trophies=[['🏆','League Champion',champions],['🥇','Golden Boot',boots],['👑','Manager Legend',s.career.trophies>=3?1:0],['🏅','Promotion Hero',s.promotions],['⭐','Five Seasons',s.career.seasons>=5?1:0],['💎','Ten Trophies',s.career.trophies>=10?1:0]];return '<div class="trophy-room"><h3>THE TROPHY CABINET</h3><div class="trophy-shelf">'+trophies.map(([icon,label,count])=>'<div class="trophy-slot '+(count?'earned':'')+'"><span class="trophy-icon">'+icon+'</span><b>'+label+'</b><small>'+(count?'UNLOCKED · '+count:'LOCKED')+'</small></div>').join('')+'</div><p style="text-align:center;color:#d7b78c;font-size:12px">Earn trophies and milestones to illuminate your collection.</p></div>'}
function sectionHero(emoji,title,subtitle,tone=''){return '<div class="section-hero '+tone+'" data-emoji="'+emoji+'"><span class="kicker">PITCH GM · '+esc(['Premier Division','Championship','League One'][s.division-1])+'</span><h2>'+esc(title)+'</h2><p>'+esc(subtitle)+'</p></div>'}
function emptyState(icon,title,desc){return '<div class="empty-state"><div class="empty-icon">'+icon+'</div><strong>'+esc(title)+'</strong><p>'+esc(desc)+'</p></div>'}
const navGroups={'Club':['Dashboard','Roster','Tactics','Front Office','Finances'],'Competitions':['Leagues','Schedule','Standings','Postseason','Match Center'],'Recruitment':['Player Market','Draft','Youth Academy','League Squads'],'Legacy':['Awards','Player Stats','League History','Retirement Hall']};
function render(){ensureWorld();save();const tabs=['Dashboard','Leagues','Roster','Tactics','Draft','Schedule','Standings','Postseason','Player Market','Finances','Front Office','Awards','League History','Retirement Hall','League Squads','Youth Academy','Match Center','Player Stats'];const activeGroup=Object.keys(navGroups).find(g=>navGroups[g].includes(tab))||'Club';$('navCategories').innerHTML=Object.keys(navGroups).map(g=>'<button data-group="'+g+'" class="'+(g===activeGroup?'active':'')+'">'+({Club:'🏠 Club',Competitions:'🏆 Competitions',Recruitment:'🔎 Recruitment',Legacy:'⭐ Legacy'}[g])+'</button>').join('');$('nav').innerHTML=navGroups[activeGroup].map(t=>'<button data-tab="'+t+'" class="'+(tab===t?'active':'')+'">'+t+'</button>').join('');let body='<div class="notice"><b>'+s.year+' · '+['Premier Division','Championship','League One'][s.division-1]+' · '+s.phase.replaceAll('_',' ').toUpperCase()+'</b> · '+esc(s.clubs[s.club].name)+' · Matchday '+s.round+'/14</div>';if(tab==='Dashboard'){body+='<div class="club-hero"><div class="eyebrow">THE MANAGER\'S OFFICE · '+['PREMIER','CHAMPIONSHIP','LEAGUE ONE'][s.division-1]+'</div><h2>'+esc(s.clubs[s.club].name)+'</h2><div class="hero-bottom"><span class="hero-chip">🏟️ League rank #'+(ranking().indexOf(s.club)+1)+'</span><span class="hero-chip">💰 '+money(s.cash)+'</span><span class="hero-chip">⚽ Matchday '+s.round+'/14</span></div></div>'+trustWidget();body+='<div class="grid">'+[['Club',s.clubs[s.club].name],['Budget',money(s.cash)],['Squad',s.roster.length+' players'],['League position','#'+(ranking().indexOf(s.club)+1)],['Board trust',s.boardConfidence+'/100'],['Trophies',s.career.trophies]].map(([k,v])=>'<div class="card"><small>'+k+'</small><div class="stat">'+esc(v)+'</div></div>').join('')+'</div><div class="card"><h2>Season control</h2><p class="muted">Draft → Regular Season → Postseason → Season Complete → Offseason</p><div class="actions">'+(s.phase==='predraft'?action('Begin season','begin',s.draftPicks>0||!minRoster()):'')+(s.phase==='regular_season'?action('Simulate matchday','round',!minRoster()):'')+(s.phase==='postseason'?action(s.postRound?'Play final':'Play semifinals','playoff'):'')+(s.phase==='season_complete'?action('Advance to offseason','offseason'):'')+'</div>'+(s.phase==='predraft'?'<p>Draft picks remaining: '+s.draftPicks+'. You must use all picks before kickoff.</p>':'')+(s.phase==='season_complete'?'<h2>Season complete — '+esc(s.clubs[s.champion].name)+' champions!</h2>':'')+'</div><div class="card"><h2>Club news</h2>'+s.news.slice(0,8).map(n=>'<p>'+esc(n)+'</p>').join('')+'</div>'}
else if(tab==='Roster')body+='<div class="card"><h2>First-team squad ('+s.roster.length+')</h2><p class="muted">Build your squad. Tap a player action to negotiate a move or renew a deal.</p>'+squadTiles(s.roster,p=>action('Sell · '+money(Math.round(value(p)*.85/50000)*50000),'sell:'+p.id,!canSell(p))+(p.years<=2?action('Extend deal','extend:'+p.id,s.fired):''))+'</div>';
else if(tab==='Tactics')body+=pitchView()+'<div class="card"><h2>Match tactics</h2><p>Attacking increases injury risk. Defensive favors caution.</p><div class="actions">'+['Balanced','Attacking','Defensive'].map(t=>action((s.tactics===t?'✓ ':'')+t,'tactic:'+t)).join('')+'</div></div><div class="card"><h2>Starting XI</h2><p>Select up to 11 players. If no lineup is selected, your strongest 11 are used automatically.</p><p class="stat">'+s.lineup.length+'/11 selected · Team rating '+strength(s.club)+'</p>'+tablePlayers(s.roster,p=>action(s.lineup.includes(p.id)?'Remove':'Start','lineup:'+p.id))+'</div>';
else if(tab==='Draft')body+=sectionHero('🎓','Draft Night','Discover the next generation. Every pick can change your club’s future.','purple')+'<div class="card"><h2>Draft Board · '+s.draftPicks+' picks remaining</h2>'+squadTiles(s.pool,p=>action('Draft prospect','draft:'+p.id,s.phase!=='predraft'||s.draftPicks<=0))+'</div>';
else if(tab==='Leagues')body+=sectionHero('🌍','The Football Pyramid','Rise through the divisions and earn your place among the elite.','gold')+tierWidget()+'<div class="card"><h2>Division history</h2><p>Current tier: '+s.division+' · Promotions: '+s.promotions+' · Relegations: '+s.relegations+'</p><p>The three-tier pyramid tracks promotion and relegation between seasons. A fully independent set of clubs and fixtures per division is planned.</p></div>';
else if(tab==='Schedule')body+=sectionHero('📅','Match Calendar','Every fixture is another chapter in your season.','green')+'<div class="card"><h2>Fixtures and results</h2>'+(s.results.length?s.results.slice().reverse().map(fixtureCard).join(''):'No matches played yet.')+'</div>';
else if(tab==='Standings')body+=sectionHero('📈','League Standings','Fight for promotion, avoid relegation, and chase the top of the table.','green')+'<div class="card"><div class="standings-list">'+ranking().map((i,n)=>{const c=s.clubs[i];return '<div class="standing '+(n<2?'promotion':n>=6?'relegation':'')+(i===s.club?' mine':'')+'"><span class="rank">'+(n+1)+'</span>'+crest(i)+'<span class="team">'+esc(c.name)+'</span><span class="record">'+c.won+'W '+c.drawn+'D<br>'+c.lost+'L</span><span class="pts">'+c.points+'</span></div>'}).join('')+'</div><p class="muted">🟢 Top two · 🔴 Bottom two · Highlighted row is your club</p></div>';
else if(tab==='Postseason')body+=sectionHero('🏆','Road to the Final','Four contenders. One champion. Every knockout match matters.','gold')+'<div class="card"><h2>Playoff bracket</h2>'+(s.postseason.length?'<div class="bracket">'+s.postseason.map(m=>'<div class="bracket-match"><div class="bracket-team">'+crest(m.a)+esc(s.clubs[m.a].name)+'</div><div class="bracket-team">'+crest(m.b)+esc(s.clubs[m.b].name)+'</div></div>').join('')+'</div>':emptyState('🏟️','The stage is being set','Finish all 14 matchdays to reveal the top-four bracket.'))+(s.phase==='postseason'?'<div class="actions">'+action('Play next round','playoff')+'</div>':'')+'</div>';
else if(tab==='Player Market'){seedMarket();body+=sectionHero('💼','Transfer Headquarters','Find the missing piece. Build a title-winning squad.','purple')+'<div class="card"><h2>Transfer market</h2><p>Clubs can reject bids based on player value, potential, age and squad needs. Transfers close during postseason.</p>'+squadTiles(s.market,p=>action('Bid '+money(Math.round(value(p)*1.12/50000)*50000),'buy:'+p.id,s.cash<value(p)*1.12||s.phase==='postseason'||s.fired))+'</div><div class="card"><h2>Free agents</h2><p>Refreshed each offseason. Signing fee: £500,000.</p>'+tablePlayers(s.freeAgents,p=>action('Sign','sign:'+p.id,s.cash<500000||s.roster.length>=30))+'</div><div class="card"><h2>Transfer history</h2>'+s.transfers.slice(0,15).map(t=>'<p>'+t.year+' · '+t.kind+' '+esc(t.name)+' · '+money(t.fee)+'</p>').join('')+'</div>'}
else if(tab==='Finances'){const wages=s.roster.reduce((n,p)=>n+p.wage,0);body+=sectionHero('💰','Financial Control','Manage the money behind your club’s success.','green')+'<div class="grid"><div class="finance-tile"><small>TRANSFER BUDGET</small><strong>'+money(s.cash)+'</strong><div class="meter"><span style="width:'+Math.min(100,s.cash/12000000*100)+'%"></span></div></div><div class="finance-tile"><small>ANNUAL PAYROLL</small><strong>'+money(wages)+'</strong><div class="meter gold"><span style="width:'+Math.min(100,wages/1100000*100)+'%"></span></div><small>'+Math.round(wages/1100000*100)+'% of £1.1m wage cap</small></div></div><div class="card"><h2>Club income & expenses</h2><div class="story-card">🏦 Season-end club funding · +£5,000,000</div><div class="story-card gold">💸 Annual player wages · −'+money(wages)+'</div><div class="story-card pink">🔁 Transfer fees · Paid or received per deal</div></div>'}
else if(tab==='Front Office')body+=sectionHero('🏢','Front Office','The board is watching. Shape the club’s future.','purple')+trustWidget()+'<div class="card"><h2>Board objectives</h2><div class="story-card">🎯 Finish in the top '+s.boardTarget+'</div><div class="story-card gold">⭐ Manager reputation · '+s.managerReputation+'/100</div><div class="story-card pink">⚠️ Seven straight losses or 15% trust triggers dismissal</div></div><div class="card"><h2>Club facilities</h2>'+Object.entries(s.facilities).map(([k,v])=>'<div class="facility"><div class="info"><strong>'+({academy:'🎓 Youth Academy',training:'💪 Training Ground',medical:'🏥 Medical Center'}[k])+'</strong><small>Level '+v+' of 5</small><div class="meter"><span style="width:'+(v*20)+'%"></span></div></div>'+action('Upgrade · £1m','upgrade:'+k,v>=5||s.cash<1000000)+'</div>').join('')+'</div>';
else if(tab==='Awards')body+=sectionHero('🏆','The Trophy Room','Your legacy deserves more than a number.','gold')+trophyRoom()+'<div class="card"><h2>Season honors</h2>'+s.seasonAwards.map(a=>'<p>'+a.year+' · '+esc(a.award)+': '+esc(a.name)+' ('+a.goals+' goals)</p>').join('')+(s.history.length?s.history.map(h=>'<p>'+h.year+' · Champions: '+esc(h.champion)+'</p>').join(''):'Complete a season to award a champion.')+'</div>';
else if(tab==='Match Center')body+=sectionHero('📺','Matchday Live','Every goal tells a story. Relive the drama.','red')+'<div class="card"><h2>Match reports</h2>'+(s.matchReports.length?s.matchReports.slice(0,28).map(m=>'<details class="story-card"><summary style="cursor:pointer">'+fixtureCard(m)+'</summary>'+(m.timeline||[]).map(ev=>'<div class="story-card gold">⚽ '+ev.minute+'′ · '+esc(s.clubs[ev.club].name)+' · '+esc(ev.text)+'</div>').join('')+'</details>').join(''):emptyState('📡','Waiting for kickoff','Simulate a matchday to unlock reports and goal commentary.'))+'</div>';
else if(tab==='Player Stats'){const leaders=[...s.roster,...Object.values(s.rivalRosters).flat()].sort((a,b)=>(b.goals||0)-(a.goals||0)).slice(0,30);body+=sectionHero('🥇','Golden Boot Race','The league’s most dangerous finishers.','gold')+'<div class="card"><h2>Top scorers</h2>'+squadTiles(leaders,p=>'<span class="pill">⚽ '+(p.goals||0)+' goals · '+(p.assists||0)+' assists</span>')+'</div>'}
else if(tab==='Youth Academy')body+=sectionHero('🔭','Future Stars','Build a legacy with homegrown talent.','green')+'<div class="card"><h2>Scouting Network</h2><p class="muted">A scouting trip costs £150,000. Upgrade your academy to improve the quality of discoveries.</p><div class="actions">'+action('🔎 Scout a prospect · £150k','scout',s.cash<150000||s.fired)+'</div></div><div class="card"><h2>Academy prospects</h2>'+(s.scouting.length?squadTiles(s.scouting,p=>action('Promote to first team','promote:'+p.id,s.roster.length>=30)):emptyState('🌟','Your next superstar awaits','Send a scout to discover young players with hidden potential.'))+'</div>';
else if(tab==='League Squads')body+=sectionHero('🛡️','Rival Clubs','Know your opponents. Scout the league.','purple')+'<div class="card"><h2>League scouting database</h2>'+Object.entries(s.rivalRosters).map(([id,players])=>'<details class="story-card"><summary style="cursor:pointer;font-weight:900;display:flex;align-items:center;gap:12px">'+crest(+id)+esc(s.clubs[+id].name)+' · '+players.length+' players</summary><p class="muted">Transfer budget: '+money(s.rivalBudgets[id])+'</p>'+squadTiles(players,()=>'<span class="pill">Rival player</span>')+'</details>').join('')+'</div>';
else if(tab==='Retirement Hall')body+=sectionHero('🌅','Hall of Veterans','Every career ends. Great stories remain.','gold')+'<div class="card"><h2>Retired footballers</h2>'+(s.retired.length?'<div class="career-line">'+s.retired.map(p=>'<div class="career-entry"><strong>⭐ '+esc(p.name)+'</strong><small>Retired '+p.year+' · Age '+p.age+' · OVR '+p.rating+'</small></div>').join('')+'</div>':emptyState('🏅','Legends in the making','Your retiring veterans will be remembered here.'))+'</div>';
else if(tab==='League History')body+=sectionHero('📜','Manager Legacy','Your career, one unforgettable season at a time.','purple')+'<div class="grid"><div class="card"><small>SEASONS</small><div class="stat">'+s.career.seasons+'</div></div><div class="card"><small>TROPHIES</small><div class="stat">'+s.career.trophies+'</div></div><div class="card"><small>DISMISSALS</small><div class="stat">'+s.career.sackings+'</div></div></div><div class="card"><h2>Career timeline</h2>'+(s.history.length?'<div class="career-line">'+s.history.map(h=>'<div class="career-entry"><strong>📅 '+h.year+' · '+esc(h.champion)+'</strong><small>Your finish: #'+h.position+' · '+h.points+' points</small></div>').join('')+'</div>':emptyState('📖','Your story begins now','Complete your first season to write the opening chapter.'))+'</div>';
if(s.fired)body=sectionHero('🚨','The Board Has Spoken','Your journey is not over. A new challenge awaits.','red')+'<div class="card"><h2>⚠️ You have been fired</h2><p>The board lost confidence in your management. Choose a new club to continue your career.</p>'+s.offers.map(i=>'<div class="row"><b>'+esc(s.clubs[i].name)+'</b>'+action('Accept job','job:'+i)+'</div>').join('')+'</div>';$('app').innerHTML=body}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.group){tab=navGroups[b.dataset.group][0];render();window.scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'});return}const a=b.dataset.act;if(!a)return;const [cmd,id]=a.split(':');if(cmd==='job')newJob(+id);else if(cmd==='begin')begin();else if(cmd==='round')seasonRound();else if(cmd==='playoff')playoff();else if(cmd==='offseason')offseason();else if(cmd==='draft')draft(+id);else if(cmd==='sign')sign(+id);else if(cmd==='release')release(+id);else if(cmd==='buy')buy(+id);else if(cmd==='scout')scout();else if(cmd==='promote')promote(+id);else if(cmd==='sell')sell(+id);else if(cmd==='extend')extend(+id);else if(cmd==='lineup')toggleLineup(+id);else if(cmd==='tactic'){s.tactics=id;render();}else if(cmd==='upgrade'&&s.cash>=1000000&&s.facilities[id]<5){s.cash-=1000000;s.facilities[id]++;render()}});$('newgame').onclick=()=>{if(confirm('Erase this career and start a new one?')){s=initial();tab='Dashboard';render()}};render();
})();
</script><script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
