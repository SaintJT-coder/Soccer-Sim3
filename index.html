<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091a25"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pitch GM"><link rel="manifest" href="./manifest.webmanifest"><title>Pitch GM — Club Franchise Simulator</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#091a25;color:#eef7f8}*{box-sizing:border-box}body{margin:0}header{background:#102937;border-bottom:1px solid #275364;padding:18px max(16px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-size:25px}h2{margin:0 0 14px}small,.muted{color:#a5bfc6}.brand{color:#60e2bd}main{max-width:1100px;margin:auto;padding:18px 14px 90px}nav{display:flex;overflow:auto;gap:8px;padding:12px 14px;background:#0c202c;position:sticky;top:0;z-index:2}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #3b6b79;background:#183b4b;color:white;padding:11px 15px;border-radius:11px;min-height:43px}button.primary{background:#26a889;color:#061d22;border-color:#26a889;font-weight:750}button:disabled{opacity:.4;cursor:not-allowed}nav button.active{background:#26a889;color:#062820}input,select{width:100%;padding:11px;border-radius:9px;border:1px solid #3b6b79;background:#0b2330;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:13px}.card{border:1px solid #295162;border-radius:15px;background:#102b3a;padding:17px;margin-bottom:13px}.stat{font-size:28px;font-weight:800;margin:8px 0;color:#69e8c7}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{display:inline-block;border:1px solid #357080;border-radius:999px;padding:4px 10px;font-size:12px;color:#bcebe1}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #285060;padding:11px 7px}th{color:#a5bfc6} .scroll{overflow:auto} .notice{background:#163c48;padding:13px;border-left:4px solid #60e2bd;border-radius:9px;margin-bottom:16px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}@media(max-width:420px){header h1{font-size:21px}main{padding:12px 10px 85px}button{padding:10px 12px}th,td{padding:8px 5px}}</style></head>
<body><header><div><h1>⚽ <span class="brand">PITCH</span> GM</h1><small>Soccer franchise management</small></div><button id="newgame">New Career</button></header><nav id="nav"></nav><main id="app"></main>
<script>
(()=>{'use strict';
const KEY='pitch-gm-save-v1',TEAMS=['Northbridge FC','Riverside United','Eastport City','Westhaven Athletic','Kingsford Rovers','Lakeside FC','Ironhill Town','Southport Albion'],FIRST=['Leo','Mateo','Alex','Diego','Omar','Lucas','Ethan','Noah','Milan','Rafael','Kai','Hugo','Ivan','Samir','Jude','Marco'],LAST=['Silva','Reyes','Walker','Costa','Khan','Mendez','Brooks','Fernandez','Miller','Santos','Novak','Turner','Pereira','Alvarez','Bennett','Diaz'],POSITIONS=['GK','DEF','DEF','DEF','DEF','MID','MID','MID','FWD','FWD','FWD'];
const $=id=>document.getElementById(id),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,money=n=>'£'+Math.round(n).toLocaleString(),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function player(id){const rating=rnd(55,80);return{id,name:FIRST[rnd(0,FIRST.length-1)]+' '+LAST[rnd(0,LAST.length-1)],pos:POSITIONS[id%POSITIONS.length],age:rnd(18,31),rating,potential:Math.min(95,rating+rnd(2,17)),wage:rnd(8,32)*1000,years:rnd(1,4)}}
function initial(){const clubs=TEAMS.map((name,i)=>({name,points:0,played:0,won:0,drawn:0,lost:0,gf:0,ga:0,strength:rnd(63,79)}));return{version:1,year:2026,phase:'predraft',round:0,club:0,cash:12000000,roster:Array.from({length:15},(_,i)=>player(i)),pool:Array.from({length:18},(_,i)=>player(i+100)),freeAgents:[],clubs,results:[],history:[],awards:[],news:['Welcome to Pitch GM. Build a squad and begin the season.'],draftPicks:2,postseason:[],postRound:0,champion:null,facilities:{academy:1,training:1,medical:1},lineup:[],boardTarget:4}}
let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(!s||s.version!==1)s=initial();let tab='Dashboard';function save(){localStorage.setItem(KEY,JSON.stringify(s))}function note(t){s.news.unshift(t);s.news=s.news.slice(0,25);save()}function strength(i){if(i!==s.club)return s.clubs[i].strength;const squad=s.roster.filter(p=>!s.lineup.length||s.lineup.includes(p.id)).sort((a,b)=>b.rating-a.rating).slice(0,11);return Math.round(squad.reduce((n,p)=>n+p.rating,0)/Math.max(1,squad.length))}function minRoster(){return s.roster.length>=11}function draft(id){if(s.phase!=='predraft'||s.draftPicks<=0)return;const p=s.pool.find(p=>p.id===id);if(!p)return;s.roster.push(p);s.pool=s.pool.filter(x=>x.id!==id);s.draftPicks--;note('Drafted '+p.name);render()}function begin(){if(s.phase!=='predraft'||s.draftPicks>0||!minRoster())return alert('Use all draft picks and keep at least 11 players.');s.phase='regular_season';s.round=0;note('Season '+s.year+' kicked off');render()}function match(a,b){const x=strength(a),y=strength(b),ga=Math.max(0,Math.round((x-y)/18+Math.random()*3)),gb=Math.max(0,Math.round((y-x)/18+Math.random()*3));const A=s.clubs[a],B=s.clubs[b];A.played++;B.played++;A.gf+=ga;A.ga+=gb;B.gf+=gb;B.ga+=ga;if(ga>gb){A.points+=3;A.won++;B.lost++}else if(gb>ga){B.points+=3;B.won++;A.lost++}else{A.points++;B.points++;A.drawn++;B.drawn++}s.results.push({year:s.year,round:s.round+1,a,b,ga,gb});return ga+'–'+gb}function seasonRound(){if(s.phase!=='regular_season'||!minRoster())return alert('At least 11 players required.');let messages=[];for(let i=0;i<4;i++){let a=(i+s.round*3)%8,b=(7-i+s.round*3)%8;if(a===b)b=(b+1)%8;messages.push(s.clubs[a].name+' '+match(a,b)+' '+s.clubs[b].name)}s.round++;note('Matchday '+s.round+': '+messages.join(' · '));if(s.round>=14){s.phase='postseason';s.postRound=0;const top=ranking().slice(0,4);s.postseason=[{a:top[0],b:top[3]},{a:top[1],b:top[2]}];note('Regular season complete. Top four advance to postseason.')}render()}function ranking(){return s.clubs.map((_,i)=>i).sort((a,b)=>s.clubs[b].points-s.clubs[a].points||(s.clubs[b].gf-s.clubs[b].ga)-(s.clubs[a].gf-s.clubs[a].ga))}function playoff(){if(s.phase!=='postseason')return;const winners=[];for(const m of s.postseason){const a=strength(m.a)+rnd(0,20),b=strength(m.b)+rnd(0,20);const w=a>=b?m.a:m.b;winners.push(w);note(s.clubs[w].name+' won a postseason tie');}if(s.postRound===0){s.postseason=[{a:winners[0],b:winners[1]}];s.postRound=1}else{s.champion=winners[0];s.phase='season_complete';s.history.unshift({year:s.year,champion:s.clubs[s.champion].name,position:ranking().indexOf(s.club)+1,points:s.clubs[s.club].points});note(s.clubs[s.champion].name+' are champions of '+s.year+'!')}render()}function offseason(){if(s.phase!=='season_complete')return;s.year++;s.phase='predraft';s.round=0;s.draftPicks=2;s.champion=null;s.postseason=[];s.postRound=0;for(const p of s.roster){p.age++;p.years--;if(p.age<29&&p.rating<p.potential)p.rating+=rnd(0,Math.min(3,p.potential-p.rating));else if(p.age>32)p.rating=Math.max(40,p.rating-rnd(0,2))}const expired=s.roster.filter(p=>p.years<=0);s.roster=s.roster.filter(p=>p.years>0);s.freeAgents=[...expired,...Array.from({length:12},(_,i)=>player(s.year*100+i))];s.pool=Array.from({length:18},(_,i)=>player(s.year*1000+i));s.clubs.forEach(c=>Object.assign(c,{points:0,played:0,won:0,drawn:0,lost:0,gf:0,ga:0}));s.results=[];s.cash+=5000000;s.lineup=[];note('Offseason: players aged, ratings developed, contracts expired, free agents refreshed');render()}function sign(id){const p=s.freeAgents.find(p=>p.id===id);if(!p||s.cash<500000)return; s.cash-=500000;p.years=3;s.roster.push(p);s.freeAgents=s.freeAgents.filter(x=>x.id!==id);note('Signed '+p.name);render()}function release(id){if(s.roster.length<=11)return alert('Minimum roster: 11 players.');s.roster=s.roster.filter(p=>p.id!==id);s.lineup=s.lineup.filter(x=>x!==id);render()}function toggleLineup(id){if(s.lineup.includes(id))s.lineup=s.lineup.filter(x=>x!==id);else if(s.lineup.length<11)s.lineup.push(id);else return alert('Select up to 11 starters.');render()}function tablePlayers(ps,buttons){return '<div class="scroll"><table><thead><tr><th>Player</th><th>Pos</th><th>Age</th><th>OVR</th><th>POT</th><th>Contract</th><th>Action</th></tr></thead><tbody>'+ps.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+p.pos+'</td><td>'+p.age+'</td><td>'+p.rating+'</td><td>'+p.potential+'</td><td>'+p.years+'y</td><td>'+buttons(p)+'</td></tr>').join('')+'</tbody></table></div>'}
const action=(label,fn,disabled=false)=>'<button data-act="'+fn+'" '+(disabled?'disabled':'')+'>'+label+'</button>';function render(){save();const tabs=['Dashboard','Roster','Tactics','Draft','Schedule','Standings','Postseason','Player Market','Finances','Front Office','Awards','League History'];$('nav').innerHTML=tabs.map(t=>'<button data-tab="'+t+'" class="'+(tab===t?'active':'')+'">'+t+'</button>').join('');let body='<div class="notice"><b>'+s.year+' · '+s.phase.replaceAll('_',' ').toUpperCase()+'</b> · '+esc(s.clubs[s.club].name)+' · Matchday '+s.round+'/14</div>';if(tab==='Dashboard'){body+='<div class="grid">'+[['Club',s.clubs[s.club].name],['Budget',money(s.cash)],['Squad',s.roster.length+' players'],['League position','#'+(ranking().indexOf(s.club)+1)]].map(([k,v])=>'<div class="card"><small>'+k+'</small><div class="stat">'+esc(v)+'</div></div>').join('')+'</div><div class="card"><h2>Season control</h2><p class="muted">Draft → Regular Season → Postseason → Season Complete → Offseason</p><div class="actions">'+(s.phase==='predraft'?action('Begin season','begin',s.draftPicks>0||!minRoster()):'')+(s.phase==='regular_season'?action('Simulate matchday','round',!minRoster()):'')+(s.phase==='postseason'?action(s.postRound?'Play final':'Play semifinals','playoff'):'')+(s.phase==='season_complete'?action('Advance to offseason','offseason'):'')+'</div>'+(s.phase==='predraft'?'<p>Draft picks remaining: '+s.draftPicks+'. You must use all picks before kickoff.</p>':'')+(s.phase==='season_complete'?'<h2>Season complete — '+esc(s.clubs[s.champion].name)+' champions!</h2>':'')+'</div><div class="card"><h2>Club news</h2>'+s.news.slice(0,8).map(n=>'<p>'+esc(n)+'</p>').join('')+'</div>'}
else if(tab==='Roster')body+='<div class="card"><h2>First-team squad ('+s.roster.length+')</h2><p class="muted">Minimum 11 players to start or simulate games.</p>'+tablePlayers(s.roster,p=>action('Release','release:'+p.id,s.roster.length<=11))+'</div>';
else if(tab==='Tactics')body+='<div class="card"><h2>Starting XI</h2><p>Select up to 11 players. If no lineup is selected, your strongest 11 are used automatically.</p><p class="stat">'+s.lineup.length+'/11 selected · Team rating '+strength(s.club)+'</p>'+tablePlayers(s.roster,p=>action(s.lineup.includes(p.id)?'Remove':'Start','lineup:'+p.id))+'</div>';
else if(tab==='Draft')body+='<div class="card"><h2>Annual youth draft</h2><p>Remaining picks: <b>'+s.draftPicks+'</b>. Draft is only open in predraft.</p>'+tablePlayers(s.pool,p=>action('Draft','draft:'+p.id,s.phase!=='predraft'||s.draftPicks<=0))+'</div>';
else if(tab==='Schedule')body+='<div class="card"><h2>Fixtures and results</h2>'+(s.results.length?s.results.slice().reverse().map(r=>'<p>MD'+r.round+' · '+esc(s.clubs[r.a].name)+' '+r.ga+'–'+r.gb+' '+esc(s.clubs[r.b].name)+'</p>').join(''):'No matches played yet.')+'</div>';
else if(tab==='Standings')body+='<div class="card"><h2>League table</h2><div class="scroll"><table><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>'+ranking().map((i,n)=>{const c=s.clubs[i];return '<tr><td>'+(n+1)+'</td><td>'+esc(c.name)+'</td><td>'+c.played+'</td><td>'+c.won+'</td><td>'+c.drawn+'</td><td>'+c.lost+'</td><td>'+(c.gf-c.ga)+'</td><td>'+c.points+'</td></tr>'}).join('')+'</table></div></div>';
else if(tab==='Postseason')body+='<div class="card"><h2>End-of-season playoffs</h2><p>Top four clubs enter a separate knockout bracket after 14 matchdays.</p>'+(s.postseason.length?s.postseason.map(m=>'<p>'+esc(s.clubs[m.a].name)+' vs '+esc(s.clubs[m.b].name)+'</p>').join(''):'Bracket opens after the regular season.')+(s.phase==='postseason'?'<div class="actions">'+action('Play next round','playoff')+'</div>':'')+'</div>';
else if(tab==='Player Market')body+='<div class="card"><h2>Free agents</h2><p>Refreshed each offseason. Signing fee: £500,000.</p>'+tablePlayers(s.freeAgents,p=>action('Sign','sign:'+p.id,s.cash<500000))+'</div>';
else if(tab==='Finances')body+='<div class="grid"><div class="card"><small>Available budget</small><div class="stat">'+money(s.cash)+'</div></div><div class="card"><small>Annual squad wages</small><div class="stat">'+money(s.roster.reduce((n,p)=>n+p.wage,0))+'</div></div></div><div class="card">Season-end club funding: £5,000,000. Transfer fees are deducted when signing players.</div>';
else if(tab==='Front Office')body+='<div class="card"><h2>Club facilities</h2>'+Object.entries(s.facilities).map(([k,v])=>'<div class="row"><p>'+k+' · Tier '+v+'/5</p>'+action('Upgrade £1m','upgrade:'+k,v>=5||s.cash<1000000)+'</div>').join('')+'<p class="muted">Facility upgrades are recorded for future systems. Academy and medical gameplay effects are not implemented yet.</p></div>';
else if(tab==='Awards')body+='<div class="card"><h2>Season honors</h2>'+(s.history.length?s.history.map(h=>'<p>'+h.year+' · Champions: '+esc(h.champion)+'</p>').join(''):'Complete a season to award a champion.')+'</div>';
else if(tab==='League History')body+='<div class="card"><h2>Past seasons</h2>'+(s.history.length?s.history.map(h=>'<p>'+h.year+' — '+esc(h.champion)+' · Your finish: #'+h.position+' ('+h.points+' pts)</p>').join(''):'No completed seasons yet.')+'</div>';
$('app').innerHTML=body}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}const a=b.dataset.act;if(!a)return;const [cmd,id]=a.split(':');if(cmd==='begin')begin();else if(cmd==='round')seasonRound();else if(cmd==='playoff')playoff();else if(cmd==='offseason')offseason();else if(cmd==='draft')draft(+id);else if(cmd==='sign')sign(+id);else if(cmd==='release')release(+id);else if(cmd==='lineup')toggleLineup(+id);else if(cmd==='upgrade'&&s.cash>=1000000&&s.facilities[id]<5){s.cash-=1000000;s.facilities[id]++;render()}});$('newgame').onclick=()=>{if(confirm('Erase this career and start a new one?')){s=initial();tab='Dashboard';render()}};render();
})();
</script></body></html>
