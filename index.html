.trophy-slot b{font-size:12px}.trophy-slot small{font-size:10px}.trophy-room h3{text-align:center;color:#ffd88d;letter-spacing:.18em;font-size:12px;text-transform:uppercase}
.league-tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tier{border-radius:16px;padding:17px 9px;text-align:center;border:1px solid #ffffff2e;background:linear-gradient(140deg,#2a365b,#202643)}.tier:nth-child(1){background:linear-gradient(145deg,#69502a,#302941)}.tier:nth-child(2){background:linear-gradient(145deg,#2a506b,#212b4c)}.tier:nth-child(3){background:linear-gradient(145deg,#42553d,#232f44)}.tier.current{outline:2px solid var(--lime);box-shadow:0 0 24px #a6ff5c33}.tier strong{display:block;font-size:13px}.tier span{font-size:27px}.tier small{display:block;margin-top:7px}

@media(max-width:360px){.grid{grid-template-columns:1fr 1fr}.stat{font-size:20px}.trophy-slot{min-height:118px}.trophy-icon{font-size:36px}}

<body><header><div><h1>⚽ <span class="brand">PITCH</span> GM</h1><small>Soccer franchise management</small></div><button id="newgame">New Career</button></header><nav id="nav"></nav><main id="app"></main>
<script>
(()=>{'use strict';
const KEY='pitch-gm-save-v1',TEAMS=['Northbridge FC','Riverside United','Eastport City','Westhaven Athletic','Kingsford Rovers','Lakeside FC','Ironhill Town','Southport Albion'],FIRST=['Leo','Mateo','Alex','Diego','Omar','Lucas','Ethan','Noah','Milan','Rafael','Kai','Hugo','Ivan','Samir','Jude','Marco'],LAST=['Silva','Reyes','Walker','Costa','Khan','Mendez','Brooks','Fernandez','Miller','Santos','Novak','Turner','Pereira','Alvarez','Bennett','Diaz'],POSITIONS=['GK','DEF','DEF','DEF','DEF','MID','MID','MID','FWD','FWD','FWD'];
const $=id=>document.getElementById(id),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,money=n=>'£'+Math.round(n).toLocaleString(),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function player(id){const rating=rnd(55,80);return{id,name:FIRST[rnd(0,FIRST.length-1)]+' '+LAST[rnd(0,LAST.length-1)],pos:POSITIONS[id%POSITIONS.length],age:rnd(18,31),rating,potential:Math.min(95,rating+rnd(2,17)),wage:rnd(8,32)*1000,years:rnd(1,4),club:0,morale:rnd(55,85),form:50,goals:0,assists:0,appearances:0,fitness:100,cleanSheets:0,careerGoals:0}}
function initial(){const clubs=TEAMS.map((name,i)=>({name,points:0,played:0,won:0,drawn:0,lost:0,gf:0,ga:0,strength:rnd(63,79)}));return{version:1,year:2026,phase:'predraft',round:0,club:0,cash:12000000,roster:Array.from({length:15},(_,i)=>player(i)),pool:Array.from({length:18},(_,i)=>player(i+100)),freeAgents:[],clubs,results:[],history:[],awards:[],news:['Welcome to Pitch GM. Build a squad and begin the season.'],draftPicks:2,postseason:[],postRound:0,champion:null,facilities:{academy:1,training:1,medical:1},lineup:[],boardTarget:4,boardConfidence:72,lossStreak:0,career:{seasons:0,trophies:0,sackings:0},fired:false,offers:[],retired:[],transfers:[],market:[],tactics:'Balanced',rivalRosters:{},rivalBudgets:{},scouting:[],events:[],matchReports:[],seasonAwards:[],managerReputation:50,division:1,promotions:0,relegations:0}}
let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(!s||s.version!==1)s=initial();s.boardConfidence??=72;s.lossStreak??=0;s.career??={seasons:0,trophies:0,sackings:0};s.fired??=false;s.offers??=[];s.retired??=[];s.transfers??=[];s.market??=[];s.tactics??='Balanced';s.rivalRosters??={};s.rivalBudgets??={};s.scouting??=[];s.events??=[];s.matchReports??=[];s.seasonAwards??=[];s.managerReputation??=50;s.division??=1;s.promotions??=0;s.relegations??=0;s.roster.forEach(p=>{p.club??=s.club;p.morale??=70;p.form??=50;p.goals??=0;p.injured??=0;p.assists??=0;p.appearances??=0;p.fitness??=100;p.cleanSheets??=0;p.careerGoals??=p.goals||0});let tab='Dashboard';function save(){localStorage.setItem(KEY,JSON.stringify(s))}function note(t){s.news.unshift(t);s.news=s.news.slice(0,25);save()}const KITS=[['#21a48b','#fff'],['#cf454c','#fff'],['#337bd0','#fff'],['#e8b83c','#152737'],['#7836b8','#fff'],['#27835d','#ffdd7a'],['#c4682b','#fff'],['#354f9c','#fff']];
function portrait(p){const [kit,trim]=KITS[(p.club??s.club)%8],skin=['#efc09b','#bb805b','#79472f','#d8a37a'][Math.abs(p.id)%4],hair=['#24201e','#553b2a','#16191f'][Math.abs(p.id)%3];const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 82"><rect width="72" height="82" rx="10" fill="#2a4656"/><ellipse cx="36" cy="30" rx="16" ry="19" fill="'+skin+'"/><path d="M20 28Q17 5 36 8Q56 5 52 28Q37 15 20 28" fill="'+hair+'"/><circle cx="30" cy="32" r="1.3" fill="#19252c"/><circle cx="42" cy="32" r="1.3" fill="#19252c"/><path d="M31 42q5 3 10 0" stroke="#754839" fill="none"/><path d="M4 82V66Q7 52 24 52L36 59L48 52Q65 52 68 66V82" fill="'+kit+'"/><path d="M30 55l6 6 6-6M14 67h44" stroke="'+trim+'" stroke-width="3" fill="none"/><text x="36" y="79" font-size="12" fill="'+trim+'" text-anchor="middle">'+(p.id%99)+'</text></svg>';return 'data:image/svg+xml,'+encodeURIComponent(svg)}
function confidence(delta){s.boardConfidence=Math.max(0,Math.min(100,s.boardConfidence+delta));if(s.boardConfidence<=15||s.lossStreak>=7){s.fired=true;s.phase='fired';s.career.sackings++;s.offers=[1,2,3,4].filter(i=>i!==s.club);note('The board has fired you. Accept a new club job to continue your career.')}}
function newJob(i){if(!s.fired||!s.offers.includes(i))return;ensureWorld();const old=s.club;s.rivalRosters[old]=s.roster.map(p=>({...p,club:old}));s.club=i;s.fired=false;s.boardConfidence=65;s.lossStreak=0;s.phase='predraft';s.year++;s.round=0;s.draftPicks=2;s.roster=s.rivalRosters[i]||Array.from({length:15},(_,j)=>({...player(s.year*1000+j),club:i}));delete s.rivalRosters[i];s.pool=Array.from({length:18},(_,j)=>player(s.year*2000+j));s.lineup=[];s.results=[];s.cash=9000000;s.clubs.forEach(c=>Object.assign(c,{points:0,played:0,won:0,drawn:0,lost:0,gf:0,ga:0}));note('Appointed manager of '+s.clubs[i].name);render()}
function value(p){const base=Math.pow(Math.max(40,p.rating)-45,2)*2400,upside=1+Math.max(0,p.potential-p.rating)*.035,age=p.age<23?1.22:p.age<29?1:p.age<32?.8:p.age<35?.5:.22;return Math.max(100000,Math.round(base*upside*age*(1+Math.max(0,p.years)*.09)/50000)*50000)}
function canSell(p){return s.roster.length>11&&s.roster.filter(x=>x.pos===p.pos).length>1&&s.phase!=='postseason'&&!s.fired}
function ensureWorld(){for(let i=0;i<s.clubs.length;i++){if(i===s.club)continue;if(!Array.isArray(s.rivalRosters[i])||!s.rivalRosters[i].length)s.rivalRosters[i]=Array.from({length:17},(_,j)=>({...player((s.year*1000000)+(i*1000)+j),club:i,injured:0}));s.rivalBudgets[i]??=rnd(8000000,17000000)}}
function seedMarket(){ensureWorld();s.market=Object.values(s.rivalRosters).flat().filter(p=>p.age<39&&p.years>0).sort((a,b)=>b.rating-a.rating).slice(0,65)}
function buy(id){if(s.fired||s.phase==='postseason')return;seedMarket();const p=s.market.find(x=>x.id===id);if(!p)return;const fee=Math.round(value(p)*1.12/50000)*50000;if(s.cash<fee)return alert('Insufficient funds.');if(s.roster.length>=30)return alert('Squad limit: 30 players.');const selling=s.rivalRosters[p.club];if(!selling||selling.length<=11||selling.filter(x=>x.pos===p.pos).length<=1)return alert('The rival club will not sell its last positional cover.');const ask=value(p)*(p.age<=24?1.35:1.05)*(selling.filter(x=>x.pos===p.pos).length<=2?1.3:1);const chance=Math.min(.96,Math.max(.1,.4+(fee/ask-1)));if(Math.random()>chance){note('Transfer bid rejected for '+p.name+'. The club wants a better deal.');render();return}if(s.roster.reduce((n,x)=>n+x.wage,0)+p.wage>1100000)return alert('Annual wage cap exceeded (£1.1m).');s.cash-=fee;s.rivalBudgets[p.club]+=fee;s.rivalRosters[p.club]=s.rivalRosters[p.club].filter(x=>x.id!==p.id);p.club=s.club;p.years=3;s.roster.push(p);s.market=s.market.filter(x=>x.id!==id);s.transfers.unshift({year:s.year,kind:'Bought',name:p.name,fee});note('Signed '+p.name+' for '+money(fee));render()}
function sell(id){const p=s.roster.find(x=>x.id===id);if(!p||!canSell(p))return alert('Keep at least 11 players and positional cover.');const fee=Math.round(value(p)*.85/50000)*50000;if(!confirm('Sell '+p.name+' for '+money(fee)+'?'))return;ensureWorld();const buyers=Object.keys(s.rivalRosters).map(Number).filter(i=>s.rivalBudgets[i]>=fee&&s.rivalRosters[i].length<25).sort((a,b)=>s.rivalRosters[a].filter(x=>x.pos===p.pos).length-s.rivalRosters[b].filter(x=>x.pos===p.pos).length);if(!buyers.length)return alert('No rival club can afford this player right now.');const buyer=buyers[0];s.rivalBudgets[buyer]-=fee;p.club=buyer;s.rivalRosters[buyer].push(p);s.cash+=fee;s.roster=s.roster.filter(x=>x.id!==id);s.lineup=s.lineup.filter(x=>x!==id);s.transfers.unshift({year:s.year,kind:'Sold',name:p.name,fee});note('Sold '+p.name+' for '+money(fee));render()}
function retireCheck(p){return p.age>=41||p.age>=33&&Math.random()<(p.age>=39?.8:p.age>=37?.48:p.age>=35?.24:.08)}
function strength(i){if(i!==s.club){ensureWorld();const roster=s.rivalRosters[i]||[];const xi=roster.filter(p=>p.injured<=0).sort((a,b)=>b.rating-a.rating).slice(0,11);return Math.round(xi.reduce((n,p)=>n+p.rating,0)/Math.max(1,xi.length))}const squad=s.roster.filter(p=>p.injured<=0&&(!s.lineup.length||s.lineup.includes(p.id))).sort((a,b)=>b.rating-a.rating).slice(0,11);return Math.round(squad.reduce((n,p)=>n+p.rating+(p.morale-60)*.07+(p.form-50)*.06+(p.fitness-75)*.1,0)/Math.max(1,squad.length)+(s.tactics==='Attacking'?2:s.tactics==='Defensive'?-1:0))}function minRoster(){return s.roster.filter(p=>!p.injured||p.injured<=0).length>=11}function draft(id){if(s.phase!=='predraft'||s.draftPicks<=0)return;const p=s.pool.find(p=>p.id===id);if(!p)return;p.club=s.club;s.roster.push(p);s.pool=s.pool.filter(x=>x.id!==id);s.draftPicks--;note('Drafted '+p.name);render()}function begin(){if(s.fired)return;if(s.phase!=='predraft'||s.draftPicks>0||!minRoster())return alert('Use all draft picks and keep at least 11 players.');s.phase='regular_season';s.round=0;note('Season '+s.year+' kicked off');render()}function scout(){if(s.fired||s.cash<150000)return alert('Scouting costs £150,000.');s.cash-=150000;const p=player(s.year*10000000+rnd(1000,99999));p.age=rnd(16,20);p.rating=rnd(48,69)+Math.min(5,s.facilities.academy);p.potential=Math.min(97,p.rating+rnd(15,27)+s.facilities.academy);p.club=s.club;s.scouting.push(p);note('Scout discovered '+p.name+' (potential '+p.potential+')');render()}
function promote(id){const p=s.scouting.find(x=>x.id===id);if(!p||s.roster.length>=30)return alert('Squad limit: 30 players.');s.scouting=s.scouting.filter(x=>x.id!==id);s.roster.push(p);note('Promoted academy prospect '+p.name);render()}
function match(a,b){const x=strength(a),y=strength(b),homeBoost=2,ga=Math.max(0,Math.round((x+homeBoost-y)/18+Math.random()*(a===s.club&&s.tactics==='Attacking'?4:3))),gb=Math.max(0,Math.round((y-x-homeBoost)/18+Math.random()*(b===s.club&&s.tactics==='Attacking'?4:3)));const A=s.clubs[a],B=s.clubs[b];A.played++;B.played++;A.gf+=ga;A.ga+=gb;B.gf+=gb;B.ga+=ga;if(ga>gb){A.points+=3;A.won++;B.lost++}else if(gb>ga){B.points+=3;B.won++;A.lost++}else{A.points++;B.points++;A.drawn++;B.drawn++}const timeline=[];for(const [club,goals] of [[a,ga],[b,gb]]){const roster=club===s.club?s.roster:(s.rivalRosters[club]||[]);const starters=roster.filter(p=>p.injured<=0).sort((u,v)=>v.rating-u.rating).slice(0,11);for(const p of starters){p.appearances=(p.appearances||0)+1;p.fitness=Math.max(35,(p.fitness??100)-rnd(5,12));if(goals===0&&p.pos==='GK')p.cleanSheets=(p.cleanSheets||0)+1}for(let j=0;j<goals;j++){const scorers=starters.filter(p=>p.pos==='FWD'||p.pos==='MID');const scorer=scorers.length?scorers[rnd(0,scorers.length-1)]:starters[0];if(!scorer)continue;scorer.goals=(scorer.goals||0)+1;scorer.careerGoals=(scorer.careerGoals||0)+1;const helper=starters.filter(p=>p.id!==scorer.id);const assist=helper.length&&Math.random()<.65?helper[rnd(0,helper.length-1)]:null;if(assist)assist.assists=(assist.assists||0)+1;timeline.push({minute:rnd(4,90),club,kind:'goal',text:scorer.name+' scores'+(assist?' (assist: '+assist.name+')':'')})}}timeline.sort((u,v)=>u.minute-v.minute);s.results.push({year:s.year,round:s.round+1,a,b,ga,gb,timeline});s.matchReports.unshift({year:s.year,round:s.round+1,a,b,ga,gb,timeline});s.matchReports=s.matchReports.slice(0,112);return ga+'–'+gb}function seasonRound(){if(s.fired)return;if(s.phase!=='regular_season'||!minRoster())return alert('At least 11 players required.');let messages=[],teams=[0,1,2,3,4,5,6,7];for(let k=0;k<s.round%7;k++)teams=[teams[0],teams[7],...teams.slice(1,7)];for(let i=0;i<4;i++){const a=s.round>=7?teams[7-i]:teams[i],b=s.round>=7?teams[i]:teams[7-i],before=s.clubs[s.club].points,score=match(a,b);messages.push(s.clubs[a].name+' '+score+' '+s.clubs[b].name);if(a===s.club||b===s.club){const gain=s.clubs[s.club].points-before;s.lossStreak=gain===0?s.lossStreak+1:0;confidence(gain===3?5:gain===1?-1:-9);s.roster.forEach(p=>{p.morale=Math.max(0,Math.min(100,p.morale+(gain===3?2:gain===0?-3:0)));p.form=Math.max(0,Math.min(100,p.form+rnd(-4,4)));if(p.injured>0)p.injured--;else if(Math.random()<(s.tactics==='Attacking'?.024:.012)/Math.max(1,s.facilities.medical*.7)){p.injured=rnd(1,3);note(p.name+' injured for '+p.injured+' matchdays.')}if(p.injured<=0)p.fitness=Math.min(100,(p.fitness??100)+rnd(2,6))})}}s.round++;note('Matchday '+s.round+': '+messages.join(' · '));if(s.round>=14&&!s.fired){s.phase='postseason';s.postRound=0;const top=ranking().slice(0,4);s.postseason=[{a:top[0],b:top[3]},{a:top[1],b:top[2]}];note('Regular season complete. Top four advance to postseason.')}render()}function ranking(){return s.clubs.map((_,i)=>i).sort((a,b)=>s.clubs[b].points-s.clubs[a].points||(s.clubs[b].gf-s.clubs[b].ga)-(s.clubs[a].gf-s.clubs[a].ga))}function playoff(){if(s.fired)return;if(s.phase!=='postseason')return;const winners=[];for(const m of s.postseason){const a=strength(m.a)+rnd(0,20),b=strength(m.b)+rnd(0,20);const w=a>=b?m.a:m.b;winners.push(w);note(s.clubs[w].name+' won a postseason tie');}if(s.postRound===0){s.postseason=[{a:winners[0],b:winners[1]}];s.postRound=1}else{s.champion=winners[0];s.phase='season_complete';s.career.seasons++;if(s.champion===s.club){s.career.trophies++;confidence(25)}else confidence(ranking().indexOf(s.club)<s.boardTarget?10:-18);s.history.unshift({year:s.year,champion:s.clubs[s.champion].name,position:ranking().indexOf(s.club)+1,points:s.clubs[s.club].points});note(s.clubs[s.champion].name+' are champions of '+s.year+'!')}render()}function offseason(){if(s.phase!=='season_complete')return;ensureWorld();const lastPosition=ranking().indexOf(s.club)+1;if(lastPosition<=2&&s.division>1){s.division--;s.promotions++;note('PROMOTED! Welcome to '+['Premier Division','Championship','League One'][s.division-1])}else if(lastPosition>=7&&s.division<3){s.division++;s.relegations++;note('RELEGATED to '+['Premier Division','Championship','League One'][s.division-1])}const allPlayers=[...s.roster,...Object.values(s.rivalRosters).flat()];const best=allPlayers.slice().sort((a,b)=>(b.goals||0)-(a.goals||0))[0];if(best){s.seasonAwards.unshift({year:s.year,award:'Golden Boot',name:best.name,club:s.clubs[best.club].name,goals:best.goals||0});note('Golden Boot: '+best.name+' ('+(best.goals||0)+' goals)')}s.managerReputation=Math.max(0,Math.min(100,s.managerReputation+(ranking().indexOf(s.club)<4?5:-4)));s.year++;s.phase='predraft';s.round=0;s.draftPicks=2;s.champion=null;s.postseason=[];s.postRound=0;const retiring=[];for(const p of s.roster){p.age++;p.years--;p.injured=0;p.goals=0;p.assists=0;p.appearances=0;p.cleanSheets=0;p.fitness=100;p.form=50;if(p.age<26&&p.rating<p.potential)p.rating+=rnd(0,Math.min(4,p.potential-p.rating));else if(p.age<30&&p.rating<p.potential)p.rating+=rnd(0,Math.min(2,p.potential-p.rating));else if(p.age>30)p.rating=Math.max(40,p.rating-rnd(0,p.age>=35?4:2));if(retireCheck(p))retiring.push(p)}s.retired.unshift(...retiring.map(p=>({name:p.name,age:p.age,year:s.year,rating:p.rating})));const ids=new Set(retiring.map(p=>p.id));const expired=s.roster.filter(p=>p.years<=0&&!ids.has(p.id));s.roster=s.roster.filter(p=>p.years>0&&!ids.has(p.id));if(retiring.length)note('Retired: '+retiring.map(p=>p.name+' ('+p.age+')').join(', '));s.market=[];for(const [clubId,players] of Object.entries(s.rivalRosters)){const keep=[];for(const p of players){p.age++;p.years--;p.goals=0;p.assists=0;p.appearances=0;p.cleanSheets=0;p.fitness=100;if(p.age<27&&p.rating<p.potential)p.rating+=rnd(0,Math.min(3,p.potential-p.rating));else if(p.age>31)p.rating=Math.max(40,p.rating-rnd(0,p.age>35?4:2));if(retireCheck(p)){s.retired.unshift({name:p.name,age:p.age,year:s.year,rating:p.rating,club:s.clubs[+clubId].name})}else if(p.years>0)keep.push(p)}while(keep.length<17){const id=s.year*1000000+(+clubId)*1000+keep.length+100;keep.push({...player(id),club:+clubId,injured:0})}s.rivalRosters[clubId]=keep;s.rivalBudgets[clubId]+=rnd(2500000,6000000)}s.freeAgents=[...expired,...Array.from({length:12},(_,i)=>({...player(s.year*100+i),club:rnd(0,7)}))];s.pool=Array.from({length:18},(_,i)=>player(s.year*1000+i));seedMarket();s.clubs.forEach(c=>Object.assign(c,{points:0,played:0,won:0,drawn:0,lost:0,gf:0,ga:0}));s.results=[];s.cash+=5000000;s.cash-=s.roster.reduce((n,p)=>n+p.wage,0);s.cash=Math.max(0,s.cash);s.lineup=[];note('Offseason: player aging, development, retirements, expired contracts, free agents and transfers refreshed');render()}function sign(id){const p=s.freeAgents.find(p=>p.id===id);if(!p||s.cash<500000||s.roster.length>=30)return; s.cash-=500000;p.years=3;p.club=s.club;s.roster.push(p);s.freeAgents=s.freeAgents.filter(x=>x.id!==id);note('Signed '+p.name);render()}function release(id){if(s.roster.length<=11)return alert('Minimum roster: 11 players.');s.roster=s.roster.filter(p=>p.id!==id);s.lineup=s.lineup.filter(x=>x!==id);render()}function extend(id){const p=s.roster.find(x=>x.id===id);if(!p||s.fired||p.years>2)return;const bonus=Math.round(value(p)*.12/50000)*50000;if(s.cash<bonus)return alert('Insufficient funds for renewal bonus '+money(bonus));if(!confirm('Renew '+p.name+' for 3 years? Signing bonus '+money(bonus)))return;s.cash-=bonus;p.years=3;p.wage=Math.round(p.wage*1.15);note('Renewed '+p.name+' through '+(s.year+3));render()}

const action=(label,fn,disabled=false)=>'<button data-act="'+fn+'" '+(disabled?'disabled':'')+'>'+label+'</button>';function trustWidget(){const v=s.boardConfidence;return '<div class="card"><h2>Board Confidence</h2><div class="trust-layout"><div class="trust-ring '+(v>=65?'good':v>=35?'mid':'bad')+'" style="--score:'+v+'"><strong>'+v+'%</strong><small>TRUST</small></div><div class="trust-copy"><h3>'+(v>=75?'Board delighted':v>=55?'Job secure':v>=35?'Under pressure':'Job in danger')+'</h3><p>Finish in the top '+s.boardTarget+' to satisfy the board. Seven straight defeats or trust of 15% means dismissal.</p></div></div></div>'}

else if(tab==='Player Stats')body+='<div class="card"><h2>League scoring leaders</h2>'+tablePlayers([...s.roster,...Object.values(s.rivalRosters).flat()].sort((a,b)=>(b.goals||0)-(a.goals||0)).slice(0,30),p=>'<span class="pill">'+(p.goals||0)+' G · '+(p.assists||0)+' A · '+(p.appearances||0)+' apps</span>')+'</div>';
else if(tab==='Youth Academy')body+='<div class="card"><h2>Youth scouting</h2><p>Invest £150,000 to discover a prospect. Higher academy tiers improve scouting outcomes.</p>'+action('Scout prospect — £150k','scout',s.cash<150000||s.fired)+'<h2>Scouted prospects</h2>'+tablePlayers(s.scouting,p=>action('Promote','promote:'+p.id,s.roster.length>=30))+'</div>';
else if(tab==='League Squads')body+='<div class="card"><h2>League squads</h2><p>Every rival club has its own persistent players, contracts, development, and transfer budget.</p>'+Object.entries(s.rivalRosters).map(([id,players])=>'<details style="margin:12px 0"><summary>'+esc(s.clubs[+id].name)+' · '+players.length+' players · '+money(s.rivalBudgets[id])+'</summary>'+tablePlayers(players,()=>'<span class="pill">Rival</span>')+'</details>').join('')+'</div>';
else if(tab==='Retirement Hall')body+='<div class="card"><h2>Retirement Hall</h2><p>Players retire during the offseason, with increasing likelihood after age 33 and mandatory retirement at age 41.</p>'+(s.retired.length?s.retired.map(p=>'<p>'+esc(p.name)+' · Age '+p.age+' · OVR '+p.rating+' · '+p.year+'</p>').join(''):'No retirements recorded yet.')+'</div>';
else if(tab==='League History')body+='<div class="card"><h2>Past seasons</h2>'+(s.history.length?s.history.map(h=>'<p>'+h.year+' — '+esc(h.champion)+' · Your finish: #'+h.position+' ('+h.points+' pts)</p>').join(''):'No completed seasons yet.')+'</div>';
if(s.fired)body='<div class="card"><h2>⚠️ You have been fired</h2><p>The board lost confidence in your management. Choose a new club to continue your career.</p>'+s.offers.map(i=>'<div class="row"><b>'+esc(s.clubs[i].name)+'</b>'+action('Accept job','job:'+i)+'</div>').join('')+'</div>';$('app').innerHTML=body}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}const a=b.dataset.act;if(!a)return;const [cmd,id]=a.split(':');if(cmd==='job')newJob(+id);else if(cmd==='begin')begin();else if(cmd==='round')seasonRound();else if(cmd==='playoff')playoff();else if(cmd==='offseason')offseason();else if(cmd==='draft')draft(+id);else if(cmd==='sign')sign(+id);else if(cmd==='release')release(+id);else if(cmd==='buy')buy(+id);else if(cmd==='scout')scout();else if(cmd==='promote')promote(+id);else if(cmd==='sell')sell(+id);else if(cmd==='extend')extend(+id);else if(cmd==='lineup')toggleLineup(+id);else if(cmd==='tactic'){s.tactics=id;render();}else if(cmd==='upgrade'&&s.cash>=1000000&&s.facilities[id]<5){s.cash-=1000000;s.facilities[id]++;render()}});$('newgame').onclick=()=>{if(confirm('Erase this career and start a new one?')){s=initial();tab='Dashboard';render()}};render();
})();
</script><script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
