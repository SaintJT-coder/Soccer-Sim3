name: Mobile gameplay smoke tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve the game locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/pitchgm-http.log 2>&1 &
          sleep 2
      - name: Check mobile layout and gameplay
        run: node tests/mobile-smoke.cjs
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitch-gm-mobile-screenshots
          path: qa-*.png
          if-no-files-found: ignore
